name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_CLIENT_ID: ci-placeholder
          VITE_CLIENT_SECRET: ci-placeholder
          VITE_TOKEN_URL: https://example.invalid/oauth/token
          VITE_API_BASE: https://example.invalid/api
          VITE_ASSIGNMENT_API_BASE: https://example.invalid/api
          VITE_CASE_ID: CI-TEST-CASE

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
